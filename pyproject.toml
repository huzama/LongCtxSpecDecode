[project]
name = "highlight-spec"
version = "0.1.0"
description = "Self-speculative decoding with Highlight selection and shared hierarchical KV"
requires-python = ">=3.13,<3.14"
# The environment is MoLLE's locked serving set (vLLM 0.27.1, torch 2.13) plus
# its spotattention package; CLAUDE.md gives the install.
dependencies = ["vllm==0.27.1", "spotattention"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."vllm.general_plugins"]
highlight_spec = "highlight_spec:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["highlight_spec"]

[tool.hatch.build.targets.wheel.force-include]
"third_party/flash_attention" = "highlight_spec/third_party/flash_attention"
