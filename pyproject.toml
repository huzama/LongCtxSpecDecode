# Dependency pins mirror the selector repo (see CLAUDE.md: selector dependency)
# so its source imports run inside this venv. Keep the two in sync when bumping.
[project]
name = "longcontextspecdecode"
version = "0.1.0"
description = "Long-context speculative decoding on sparse attention"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.4.1",
    "flash-linear-attention>=0.5.0",
    "ninja>=1.13.0",
    "nvidia-cuda-cccl>=13.2.75,<13.3",
    "nvidia-cuda-nvcc>=13.2.78,<13.3",
    "pyyaml>=6.0.3",
    "torch~=2.11",
    "transformers~=5.6",
    "tyro>=0.9.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specdec"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
