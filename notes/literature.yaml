# Literature for long-context speculative decoding: every paper we read,
# grouped by method family with a verdict per family, then the findings the
# survey settled on. Hand-maintained; this file is the single source.
#
# Paper fields: name, arxiv (or url), year, venue (optional), family (key
#   below), summary, lossless (true/false/"~"/omit), max_ctx (max context
#   evaluated), acceptance, speedup, note (long-context behavior or caveat).
# "~" lossless = conditional (lossy mode, or lossless w.r.t. a modified target).
#
# Read the family verdicts first; pull individual papers only when an idea or
# experiment needs them.

families:
  - key: independent
    name: "Independent AR drafters"
    verdict: "☠️ Dead at long context: GQA floors drafter KV (speedup ceiling ~1.1x) and acceptance collapses by 8–16K."
  - key: draft-heads
    name: "Draft heads (Medusa / EAGLE / MTP)"
    verdict: "❌ Die beyond the trained window unless drafter state is O(1) or norm-fixed; trained-short is the failure, not the head architecture."
  - key: layer-skip
    name: "Self-speculation: layer skip"
    verdict: "🪦 Capped at ~1.0–1.5x: cost ratio is context-invariant, so it cannot touch the KV term that dominates 128K+. Secondary multiplier at best."
  - key: early-exit
    name: "Early exit"
    verdict: "❓ Zero long-context evidence anywhere; structurally 1M-friendly (shared exit-layer KV) but unmeasured past 16K and no 128K training recipe exists."
  - key: sparse-kv
    name: "Sparse-KV drafting"
    verdict: "✅ The converged recipe: survives and strengthens with context and batch. Constraints: selection must be attention-retrieval not eviction; budget likely grows with S; verification becomes the bottleneck."
  - key: sparse-selection
    name: "Sparse-attention KV selection"
    verdict: "✅ Training-free query-aware selection matches trained selection at moderate density; the measured gap is selector cost, not quality. Quality separates only at aggressive budgets, where nobody has compared them."
  - key: kv-compression
    name: "KV-compression drafting"
    verdict: "✅ Strongest acceptance-vs-length results in the literature; the 128K high-water marks live here or adjacent."
  - key: compressed-draft
    name: "Compressed-weight and pruned drafting"
    verdict: "☠️ Attacks the weight term, which is 1–9% of decode bytes once batch and context grow. Neuron sparsity vanishes under batching, and untrained width pruning costs a quarter of accepted length."
  - key: sparse-verify
    name: "Sparse / partial verification"
    verdict: "🔥 The 2026 frontier: attacks the true bottleneck (verify KV bytes = 85–95% of round time) but silently abandons the target distribution. No divergence certificates exist."
  - key: retrieval
    name: "Retrieval / n-gram / suffix drafting"
    verdict: "✅ Only family trivially length-robust on the draft side (zero drafter KV); beats trained heads at 4–64K in third-party evals; task-dependent; unmeasured past 64K."
  - key: diffusion
    name: "Block-diffusion drafters"
    verdict: "⚠️ SOTA short-context drafting; decays hard by 32K zero-shot; bidirectional attention over long prompts is quadratic and unanalyzed; nothing past 32K."
  - key: tree-theory
    name: "Tree speculation & theory"
    verdict: "📐 No theory anywhere has a context-length axis; the log(P) acceptance ceiling kills giant trees; optimal tree-vs-context is unsolved."
  - key: serving
    name: "Serving systems & runtime control"
    verdict: "🏭 The engines serving 128K–1M cannot compose the needed features (no dynamic trees on MLA/SWA in TRT-LLM; vLLM PP+SD gaps); gains compress to 1.4–2.0x at production concurrency."
  - key: rl-rollout
    name: "RL rollout acceleration"
    verdict: "🏭 Crowded and trained-drafter shaped. Frameworks measure slowdowns and ship staleness bugs; no entry drafts against sparse KV; and enabling speculation currently disables the importance-sampling correction that keeps RL training stable."
  - key: ssm-hybrid
    name: "SSM / linear / hybrid drafters & targets, cross-tokenizer"
    verdict: "🕳️ The O(1)-state drafters that should dominate at 128K have never been measured there; sequential-hybrid targets are effectively un-draftable via component reuse (α=0.038)."

papers:
