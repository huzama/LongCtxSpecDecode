    year: 2026
    family: draft-heads
    summary: "Sink + constant window KV for MTP heads (~99% draft KV dropped)"
    lossless: true
    max_ctx: "1M"
    acceptance: "matched vs full-KV MTP @1M"
    note: "Lone 1M draft-KV datapoint; deflates 'budget must grow' stories for MTP heads"

