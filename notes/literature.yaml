    lossless: true
    max_ctx: "64K (via OWL)"
    acceptance: "τ1.28 @4–64K (OWL)"
    speedup: "≤6.5x short ctx; 0.81x long ctx"
    note: "Long context is its known failure mode; +38% throughput at batch 64 short-ctx"
  - name: "EAGLE 3.1"
    url: "https://vllm.ai/blog/2026-05-26-eagle-3-1"
    year: 2026
    venue: "vLLM blog"
    family: draft-heads
    summary: "FC/post-norm fixes for attention drift at deep speculation"
    lossless: true
    max_ctx: "32K"
    acceptance: "~2x AL vs EAGLE-3 (long ctx)"
    speedup: "2.03x @c=1 → 1.66x @c=16"
    note: "No acceptance-vs-context curve past 32K"
  - name: "P-EAGLE"
    arxiv: "2602.01469"
    year: 2026
    venue: "vLLM"
    family: draft-heads
    summary: "Single-pass parallel drafting (K=7)"
    lossless: true
    speedup: "1.69x over EAGLE-3; +55–69% @c=1 → +5–25% @c=64"
    note: "Gains compress with concurrency"
  - name: "OWL"
    arxiv: "2510.07535"
    year: 2025
    venue: "Snowflake"
    family: draft-heads
    summary: "O(1)-state LSTM drafter off final hidden state + [SPEC] token; hybrid tree/non-tree"
    lossless: true
    max_ctx: "100K+"
    acceptance: "τ4.00–4.27; HOWL hybrid τ6.14"
    speedup: "2.35x (HOWL 3.08x) on Llama-3.3-70B"
    note: "Introduces LongSpecBench; acceptance ~length-independent by construction"
  - name: "Attention Drift"
    arxiv: "2605.09992"
    year: 2026
    family: draft-heads
    summary: "Diagnoses drafter hidden-state magnitude growth pulling attention off the prompt; post-norm fix"
    lossless: true
    speedup: "1.18x on long-context tasks"
    note: "Norm fix transfers across head-based drafters"
  - name: "DeepSeek-V3 MTP"
    arxiv: "2412.19437"
    year: 2024
    family: draft-heads
    summary: "Weight-amortizing multi-token-prediction head, shipped in 128K production"
    lossless: true
    max_ctx: "128K (production)"
    acceptance: "85–90% second-token"
    speedup: "1.8x TPS"
    note: "No acceptance-vs-length breakdown ever published"
  - name: "Windowed-MTP"
