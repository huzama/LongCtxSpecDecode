  - name: "Speculative Decoding (Leviathan et al.)"
    arxiv: "2211.17192"
    year: 2023
    venue: "ICML'23"
    family: independent
    summary: "Original draft-then-verify with rejection sampling; introduced α, γ and the speedup formula"
    lossless: true
    max_ctx: "<2K"
    speedup: "2–3.4x vs AR (T5-XXL)"
    note: "Drafter carries full growing KV; no KV-bound analysis"
  - name: "Speculative Sampling (Chen et al.)"
    arxiv: "2302.01318"
    year: 2023
    venue: "DeepMind"
    family: independent
    summary: "Concurrent discovery; modified rejection sampling; 4B drafter for Chinchilla-70B"
    lossless: true
    max_ctx: "<2K"
    speedup: "2–2.5x vs AR (Chinchilla-70B)"
    note: "No long-context analysis"

