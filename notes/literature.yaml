    summary: "Feature-level AR head with token-shift disambiguation; static draft tree"
    lossless: true
    max_ctx: "<4K"
    speedup: "2.7–3.5x vs AR"
    note: "Head keeps its own growing feature-KV; acceptance collapses past trained window"
  - name: "EAGLE-2"
