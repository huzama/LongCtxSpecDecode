    speedup: "3.05–4.26x vs AR"
    note: "Sub-1.0x at batch ~24 in SGLang; long-context decay inherited from EAGLE-1"
  - name: "EAGLE-3"
    arxiv: "2503.01840"
    year: 2025
    venue: "NeurIPS'25"
    family: draft-heads
